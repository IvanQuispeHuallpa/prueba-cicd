<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
</head>
<body>
  <h1>Calculadora v1</h1>
  <input id="a" type="number" value="2">
  <input id="b" type="number" value="3">
  <button id="btn">Sumar</button>
  <p id="resultado"></p>

  <script type="module">
    import { sumar } from "./suma.js";

    document.getElementById("btn").onclick = () => {
      const a = Number(document.getElementById("a").value);
      const b = Number(document.getElementById("b").value);
      document.getElementById("resultado").textContent = sumar(a, b);
    };
  </script>
</body>
</html>
